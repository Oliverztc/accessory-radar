server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  types { application/json json; font/woff2 woff2; }
  include /etc/nginx/mime.types;
  location ~ ^/(data|config)/ { add_header Cache-Control "public, max-age=0, must-revalidate"; try_files $uri =404; }
  location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location ~ /\.(git|env|vercel) { deny all; }
  location ~ \.(py|sh|md)$ { deny all; }
  location / { try_files $uri $uri/ /index.html; }
}
